name: APK NBL Android
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Khoa ky APK
        env:
          KS: ${{ secrets.NBL_KEYSTORE_BASE64 }}
        run: |
          echo "NBL_VERSION_CODE=$((4300 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -z "$KS" ]; then echo "::warning::Chua co secret NBL_KEYSTORE_BASE64: chi build ban THU (khoa debug), khong dung de cai lau dai"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/nbl.jks"
          echo "NBL_KEYSTORE=$RUNNER_TEMP/nbl.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: mobile
        env:
          NBL_KEYSTORE_PASSWORD: ${{ secrets.NBL_KEYSTORE_PASSWORD }}
          NBL_KEY_ALIAS: ${{ secrets.NBL_KEY_ALIAS }}
          NBL_KEY_PASSWORD: ${{ secrets.NBL_KEY_PASSWORD }}
        run: |
          if [ -n "$NBL_KEYSTORE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../NBL_LIVE_Android_4.3.0.apk"
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../NBL_LIVE_Android_4.3.0.apk"
          fi
          sha256sum ../NBL_LIVE_Android_4.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NBL_LIVE_Android
          path: NBL_LIVE_Android_4.3.0.apk
