name: APK NBL Android
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Khoa ky APK
        env:
          KS: ${{ secrets.NBL_KEYSTORE_BASE64 }}
          PW: ${{ secrets.NBL_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.NBL_KEY_ALIAS }}
        run: |
          echo "NBL_VERSION_CODE=$((4300 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -z "$KS" ]; then echo "::warning::Chua co secret NBL_KEYSTORE_BASE64: chi build ban THU (khoa debug)"; exit 0; fi
          # chu dan co the lan dau cach / xuong dong / ca dong ten secret: bo het
          printf '%s' "$KS" | sed 's/NBL_KEYSTORE_BASE64//g' | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
          echo "::notice::Secret NBL_KEYSTORE_BASE64 dai $(wc -c < "$RUNNER_TEMP/ks.b64") ky tu (dung la 1408 cho khoa NBL)"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/nbl.jks" 2>/dev/null; then echo "::error::NBL_KEYSTORE_BASE64 khong phai chuoi base64 hop le: dan lai DUNG dong dai duoi chu NBL_KEYSTORE_BASE64 trong file SECRETS_DAN_VAO_GITHUB.txt"; exit 1; fi
          PW=$(printf '%s' "$PW" | tr -d ' \r\n\t'); AL=$(printf '%s' "$AL" | tr -d ' \r\n\t')
          if [ -z "$PW" ] || [ -z "$AL" ]; then echo "::error::Thieu secret NBL_KEYSTORE_PASSWORD hoac NBL_KEY_ALIAS"; exit 1; fi
          if ! keytool -list -keystore "$RUNNER_TEMP/nbl.jks" -storepass "$PW" -alias "$AL" >/dev/null 2>&1; then echo "::error::Mat khau (NBL_KEYSTORE_PASSWORD) hoac ten khoa (NBL_KEY_ALIAS, phai la: nbl) khong khop voi khoa"; exit 1; fi
          echo "::notice::Khoa ky APK hop le"
          echo "NBL_KEYSTORE=$RUNNER_TEMP/nbl.jks" >> "$GITHUB_ENV"
          echo "NBL_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "NBL_KEY_ALIAS=$AL" >> "$GITHUB_ENV"
          echo "NBL_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: mobile
        run: |
          if [ -n "$NBL_KEYSTORE" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../NBL_LIVE_Android_4.3.14.apk"
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../NBL_LIVE_Android_4.3.14.apk"
          fi
          sha256sum ../NBL_LIVE_Android_4.3.14.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NBL_LIVE_Android
          path: NBL_LIVE_Android_4.3.14.apk
      - name: Day APK vao nhanh apk-out (artifact khong tai duoc tu may dung ban)
        run: |
          set -e
          mkdir apkout; cp NBL_LIVE_Android_4.3.14.apk apkout/; cd apkout
          sha256sum NBL_LIVE_Android_4.3.14.apk > NBL_LIVE_Android_4.3.14.apk.sha256
          if [ -n "$NBL_KEYSTORE" ]; then echo signed > ky.txt; else echo debug > ky.txt; fi
          git init -q -b apk-out
          git config user.name nbl-ci; git config user.email nbl-ci@users.noreply.github.com
          git add -A; git commit -q -m "APK 4.3.14 ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/apk-out
